        - text: joineRML and the broom package
          href: articles/joineRML-tidy.html
        - text: -------
        - text: Technical details (PDF)
          href: technical.pdf
    github:
      icon: fa-github
      href: https://github.com/graemeleehickey/joineRML
      aria-label: GitHub repository

