url: https://graemeleehickey.github.io/joineRML/

template:
  bootstrap: 5

home:
  title: Joint modelling of multivariate longitudinal and time-to-event data
  description: >
    Fit joint models for multivariate longitudinal outcomes and time-to-event
    data using a Monte Carlo expectation-maximization algorithm.

navbar:
